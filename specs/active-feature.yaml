schema_version: "1.0"
feature_id: "issue-963-social-system-options"
title: "Add name-sharing and gift-system options"
status: "verifying"
user_story:
  as_a: "a player configuring a Qud Expanded Community Edition run"
  i_want_to: "toggle the name-sharing and gift systems from Qud Options > Mods"
  so_that: "I can choose the social additions that fit my run without disabling unrelated mod features"
acceptance_criteria:
  - id: "AC-001"
    statement: "Qud Options > Mods contains one clear checkbox for the combined name-sharing and gift system."
    verification:
      tests: []
      manual_checks: ["MC-001"]
  - id: "AC-002"
    statement: "The existing OptionQudExpandedCEAskName option becomes the stable combined toggle, with display text and helptext that describe both systems."
    verification:
      tests: []
      manual_checks: ["MC-002"]
  - id: "AC-003"
    statement: "The combined toggle gates ask-name, self-introduction, introduction detection, dependent name-sharing choices, the Vixy_Gift conversation choice, and new Vixy_OpinionGift tracking."
    verification:
      tests: []
      manual_checks: ["MC-003"]
  - id: "AC-004"
    statement: "Turning the combined toggle off does not change player renaming, ordinary trade, water rituals, unrelated opinions, existing names, or existing gift opinions."
    verification:
      tests: []
      manual_checks: ["MC-004"]
  - id: "AC-005"
    statement: "Turning the combined toggle on restores both systems without requiring a new game and preserves all state created while it was off."
    verification:
      tests: []
      manual_checks: ["MC-005"]
  - id: "AC-006"
    statement: "Documentation records the combined scope, default-on behavior, live option timing, and the effect of the existing AskName preference on both systems."
    verification:
      tests: []
      manual_checks: ["MC-006"]
  - id: "AC-007"
    statement: "The changed option passes mod validation, Python unit tests, and an in-game interaction check."
    verification:
      tests: ["TC-001", "TC-002"]
      manual_checks: ["MC-007"]
impact:
  affected_modules:
    - "mod/Core/Options.xml"
    - "mod/Core/Conversations.xml"
    - "mod/Scripting/Raven_Options.cs"
    - "mod/Scripting/Vixy_AskName.cs"
    - "mod/Scripting/Vixy_Introduce.cs"
    - "mod/Scripting/Vixy_Introductions.cs"
    - "mod/Scripting/Vixy_RitualGate.cs"
    - "mod/Scripting/Vixy_Gift.cs"
    - "mod/Scripting/Vixy_OpinionGift.cs"
    - "docs/FEATURES.md"
    - "CHANGELOG.md"
  affected_data:
    - "Qud option declarations and persisted option values"
    - "Vixy_Introduced per-creature name-sharing markers"
    - "Vixy_OpinionGift serialized opinion records"
  affected_external_interfaces:
    - "Qud Options > Mods menu"
    - "BaseConversation distributed choices"
    - "Water ritual visibility gate"
    - "Creature conversation and gift interactions"
  compatibility_risks:
    - "Removing a conversation choice can strand a name-sharing or gift path if gates are not coordinated."
    - "Changing serialized opinion types or namespaces can orphan existing gift records."
    - "A renamed option ID can reset existing player preferences."
  migration_required: false
  dependencies:
    - "Issue #963"
    - "mod/Scripting/Vixy_AskName.cs"
    - "mod/Scripting/Vixy_Gift.cs"
    - "mod/Scripting/Vixy_OpinionGift.cs"
  risks:
    - "The name-sharing system includes ask-name, self-introduction, introduction detection, and ritual gating."
    - "The gift system must disable new gifts without erasing existing opinion state."
    - "Live option changes can affect conversations already open."
decision_records: []
design:
  summary: "Broaden the existing AskName option into one default-on, live social-systems toggle. Gate the complete name-sharing and gift interaction surfaces without changing stored names, opinions, ordinary trade, or water rituals."
  constraints:
    - "Preserve current behavior when the combined option remains enabled."
    - "Keep OptionQudExpandedCEAskName as the stable option ID so existing preference storage remains addressable."
    - "Explain in helptext that the existing AskName setting now controls both systems."
    - "Use idempotent option reads through Raven_Options."
    - "Keep existing names and Vixy_OpinionGift records when the option is disabled."
    - "Do not gate ordinary trade, water rituals, or unrelated opinion subjects."
    - "Keep development files outside mod/."
  affected_interfaces:
    - "OptionQudExpandedCEAskName display text and helptext"
    - "Raven_Options.AskName live boolean property"
    - "Conversation choice visibility parts"
    - "Vixy_Introduced name-sharing marker consumers"
    - "Vixy_OpinionGift opinion lookup and display"
  data_flow:
    - "Options.xml keeps OptionQudExpandedCEAskName in the Mods category and documents its combined scope."
    - "Raven_Options.AskName exposes the live combined value to conversation parts."
    - "Name-sharing parts gate ask-name, self-introduction, introduction detection, and dependent familiar choices."
    - "Gift parts gate the gift choice and new Vixy_OpinionGift updates using the same value."
    - "Existing names and gift opinions remain readable when the combined option is disabled."
  rejected_alternatives:
    - "Add separate name and gift toggles because the shared introduction marker and progression gates can enter inconsistent states."
    - "Add a new combined option ID because it would abandon existing AskName preference storage."
    - "Delete existing names or gift opinions when the player disables the combined option."
    - "Disable ordinary trade or water rituals with the combined option."
    - "Add separate options for every name-sharing or gift subfeature."
test_plan:
  mode: "mixed"
  reason: "Option declarations and Python checks are automated. Conversation behavior and option timing require an in-game manual check."
  fixture_paths: []
  tests:
    - id: "TC-001"
      file: "tools/test_validate_mod.py"
      name: "mod validation accepts the option and conversation changes"
      command: "python3 tools/validate_mod.py --all"
      result: "passed"
      red_evidence: "Pre-implementation validation failed because the repository had no released changelog heading. After adding the required release heading and feature entry, validation passed."
    - id: "TC-002"
      file: "tools/test_check_docs.py"
      name: "documentation checks pass after the option documentation update"
      command: "python3 -m unittest tools.test_check_docs -v"
      result: "failed"
      red_evidence: "Pre-implementation and post-implementation runs fail only ClaimCoverage.test_the_repository_agrees_with_itself_today with three pre-existing claim-coverage findings."
  manual_checks:
    - id: "MC-001"
      description: "Open Qud Options > Mods and confirm one combined name-sharing and gift checkbox has clear text and a default of enabled."
      result: "not_run"
    - id: "MC-002"
      description: "Confirm that OptionQudExpandedCEAskName remains the stored option ID and that its helptext describes both systems."
      result: "not_run"
    - id: "MC-003"
      description: "With the combined option disabled, verify that ask-name, self-introduction, introduction detection, dependent name choices, and the gift choice are unavailable."
      result: "not_run"
    - id: "MC-004"
      description: "With the combined option disabled, verify that player renaming, ordinary trade, water rituals, unrelated opinions, existing names, and existing gift opinions remain unchanged."
      result: "not_run"
    - id: "MC-005"
      description: "Re-enable the combined option without starting a new game and verify that both systems return while prior state remains intact."
      result: "not_run"
    - id: "MC-006"
      description: "Review documentation for combined scope, default-on behavior, live timing, and existing AskName preference effects."
      result: "not_run"
    - id: "MC-007"
      description: "Exercise the combined toggle in a Qud conversation flow before and after changing the option."
      result: "not_run"
verification:
  status: "not_run"
  evidence:
    - "python3 tools/validate_mod.py --all passed."
    - "python3 -m unittest tools.test_check_docs -v ran with one pre-existing ClaimCoverage failure."
    - "git diff --check passed."
implementation_plan:
  files_to_create: []
  files_to_modify:
    - "mod/Core/Options.xml"
    - "mod/Core/Conversations.xml"
    - "mod/Scripting/Raven_Options.cs"
    - "mod/Scripting/Vixy_AskName.cs"
    - "mod/Scripting/Vixy_Introduce.cs"
    - "mod/Scripting/Vixy_Introductions.cs"
    - "mod/Scripting/Vixy_RitualGate.cs"
    - "mod/Scripting/Vixy_Gift.cs"
    - "mod/Scripting/Vixy_OpinionGift.cs"
    - "docs/FEATURES.md"
    - "CHANGELOG.md"
  files_to_delete: []
  files_to_rename: []
