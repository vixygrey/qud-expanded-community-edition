version: 1.0.0
project_name: "Qud Expanded Community Edition"
tech_stack:
  shipped_content: "Qud XML, RPM map patches, JSON metadata, C# scripts, and textures"
  tooling_language: "Python 3"
  tooling_runtime: "Python 3 standard library tooling"
  game_runtime: "Caves of Qud game runtime"
  formatting_runtime: "Node.js 24 in CI with Prettier"
  build_tool: "No mod build step"
repository_layout:
  shipped_mod: "mod/"
  documentation: "docs/"
  specifications: "specs/"
  tooling: "tools/"
  automation: ".github/"
constraints:
  shipped_content_boundary: "Keep development files outside mod/"
  script_compilation: "Compile C# against installed Qud assemblies when available"
  xml_formatting: "Use Prettier settings for mod/**/*.xml and mod/**/*.rpm"
  python_formatting: "Use Ruff settings for tools/"
  line_endings: "Use UTF-8 and LF line endings"
  identifier_compatibility: "Preserve save-backed identifiers and resolved Qud references"
security:
  external_input: "Treat files, network responses, commands, and player input as untrusted"
  scripting_policy: "Do not add file I/O outside mod/, network access, telemetry, shell execution, external assembly loading, Harmony, or reflection"
  secrets: "Do not commit secrets, credentials, or personal data"
testing_strategy:
  unit_tests:
    framework: "Python unittest"
    location: "tools/test_*.py"
    command: "python3 -m unittest discover -s tools -v"
  mod_validation:
    command: "python3 tools/validate_mod.py --all"
  documentation_validation:
    command: "python3 tools/check_docs.py"
  type_check:
    tool: "basedpyright"
    command: "basedpyright tools/"
  formatting:
    xml_command: "npx prettier --check 'mod/**/*.xml' 'mod/**/*.rpm'"
    python_commands: "ruff check tools/ and ruff format --check tools/"
  manual_game_checks:
    command: "pre-commit run --hook-stage manual check-build-log"
