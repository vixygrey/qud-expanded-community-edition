# Spell-check policy
#
# `typos` matches a curated typo -> correction corpus, NOT an English dictionary, so invented
# vocabulary does not trip it. Verified against this repo with the allowlist emptied: zetachrome,
# crysteel, fullerite, snapjaw, dromad, urshiib, yuckwheat, witchwood, watervine, vinereaper,
# nanoweave, maceth, Joppa and the rest all pass untouched. Only the three entries below fired.
#
# RULE: add an entry only after seeing it produce a false positive, never pre-emptively. Every
# entry permanently exempts that word from checking, including in player-facing text, so a
# padded allowlist quietly disables the check it is meant to support.
#
# Qud-vocabulary false positives are expected to be rare. When one appears, add it here with a
# comment saying what it is.

[default.extend-words]
# Stat abbreviations in docs/FEATURES.md tables
TOU = "TOU"
WIL = "WIL"
# FEATURES.md shorthand for "inherited" in stat tables
inh = "inh"

[files]
extend-exclude = [
  "docs/2.2-changelog.txt",          # Mura's document, preserved verbatim
  "docs/mura-feature-notes-wip.txt", # likewise
  "mod/Textures/**",
  # Generated by tools/snapshot_qud_api.py: 5,202 of Freehold's blueprint names and 1,605 class
  # names, verbatim. Nobody wrote this prose and nobody can fix a typo in it - the names have to
  # match the game exactly or the checks reading them are wrong.
  #
  # Excluded as a file rather than allowlisted as words, per the rule above. Qud's own vocabulary
  # collides with real corrections - Mak, Otho, Thah, Girshling Cresh, Shug'rith - and one of them,
  # Finish_ExploringRedrock_TravelToBethseda, is a genuine misspelling in vanilla's quest ID.
  # Allowlisting these would exempt them from every document in the repo, including player-facing
  # text, which is exactly the padding this policy exists to prevent.
  "tools/qud-api.json",
  # Name syllables, not prose. `thi`, `sya`, `nye` and the rest are fragments assembled into
  # invented names -- nobody wrote a word here and there is no typo to fix. Excluded as a file
  # for the same reason as the snapshot above: allowlisting `thi` as a word would exempt it from
  # every document in the repo including player-facing text, which is the padding this policy
  # exists to prevent.
  "mod/Naming.xml",
]
