# Spell-check policy
#
# `typos` matches a curated typo -> correction corpus, NOT an English dictionary, so invented
# vocabulary does not trip it. Verified against this repo with the allowlist emptied: zetachrome,
# crysteel, fullerite, snapjaw, dromad, urshiib, yuckwheat, witchwood, watervine, vinereaper,
# nanoweave, maceth, Joppa and the rest all pass untouched. Only the three entries below fired.
#
# RULE: add an entry only after seeing it produce a false positive, never pre-emptively. Every
# entry permanently exempts that word from checking, including in player-facing text, so a
# padded allowlist quietly disables the check it is meant to support.
#
# Qud-vocabulary false positives are expected to be rare. When one appears, add it here with a
# comment saying what it is.

[default.extend-identifiers]
# "PNGs" - typos splits it into PN + Gs and reads PN as a misspelling of ON. Plural of a file
# format, in docs/TILES_AND_ATLAS.md. extend-words does not work here because it matches the
# split subword, not the whole token. #645.
PNGs = "PNGs"
# "knownRecipies" - Freehold's own misspelling of a public field on CookingGameState, quoted verbatim
# in docs/LESSONS.md because the entry is about what that field's comparison actually does. Correcting
# the spelling would make the quotation wrong. #678.
knownRecipies = "knownRecipies"
# "Otho" - Barathrum's steward at Grit Gate, a name in player-facing text since #633's third cast
# gave him a conversation, and a vanilla blueprint name quoted in docs/LESSONS.md. `typos` reads the
# leading Otho as a misspelling of Otoh. #701 allowlisted `OthoWander1` alone; #633's third cast added
# the bare name to extend-words instead, and #633's fourth moved it here.
#
# Identifiers rather than a word, which costs one line per compound because `typos` splits compounds
# into words before matching. The looser `extend-words` form does work for this name - "Otoh" is an
# abbreviation for "on the other hand" and appears nowhere in this repository - but it matches
# case-insensitively, and the policy above is that an entry should exempt what actually fired and
# nothing else. `Mak` below cannot take the looser form at all, and having the two names allowlisted
# by different mechanisms invited the question every time. #633.
Otho = "Otho"
OthoCopy = "OthoCopy"
OthoWander1 = "OthoWander1"
MoveOtho = "MoveOtho"
PlayerOthoWander1Safeguard = "PlayerOthoWander1Safeguard"
Vixy_OthoFamiliar = "Vixy_OthoFamiliar"
Vixy_OthoFamiliarReply = "Vixy_OthoFamiliarReply"
# "Mak" - a founder of Yd Freehold, and a name in player-facing text since #633's fourth cast gave
# him a conversation. Three entries because `typos` splits compounds into words before matching, so
# the choice and node IDs need listing alongside the bare name.
#
# An *identifier* rather than a word, and unlike Otho below that distinction is load-bearing.
# `extend-words` matches case-insensitively - verified - so `Mak = "Mak"` would also stop `mak` being
# corrected to `make` or `mask` anywhere in the repo, and those are common enough words that a real
# typo would slip through. `extend-identifiers` is case-sensitive, so this exempts `Mak` while
# leaving `mak` and `MAK` checked. Otho could take the looser form because "Otoh" appears nowhere;
# this cannot. #633.
Mak = "Mak"
Vixy_MakFamiliar = "Vixy_MakFamiliar"
Vixy_MakFamiliarReply = "Vixy_MakFamiliarReply"
# "Thah" - a vanilla NPC at the Hydropon, cited in docs/FEATURES.md and mod/Core/Conversations.xml as
# the only conversation in the game that marks a catch-all `<text>` with `Priority="-1"`. An
# identifier for the same reason as Mak above, and more urgently: the correction is "than", so the
# case-insensitive `extend-words` form would stop one of the commonest words in English being checked
# anywhere in the repo. #633.
Thah = "Thah"
Vixy_ThahFamiliar = "Vixy_ThahFamiliar"
Vixy_ThahFamiliarReply = "Vixy_ThahFamiliarReply"
# "welcom" and "heigh" - Rainwater Shomer's own spellings, not mine. His whole register is Middle
# English ("Saad, welcom", "crossen nou thrugh the heigh gate"), and §61.5t writes him in it, so the
# archaic forms reach this fork's player-facing text as well as quotations of his. Vanilla uses
# `welcom` once and `heigh` three times.
#
# Only these two. The first draft also carried `alle` and `shal`, which were my inventions rather than
# his, and those were rewritten instead of allowlisted - the policy above is that an entry exempts
# what actually fired and nothing else, and four entries for one NPC's dialect is the padding it
# warns about. Identifiers, so only these exact lowercase forms are exempt. #633.
welcom = "welcom"
heigh = "heigh"

[default.extend-words]
# Stat abbreviations in docs/FEATURES.md tables
TOU = "TOU"
WIL = "WIL"
# FEATURES.md shorthand for "inherited" in stat tables
inh = "inh"
# The sie/hir pronoun set. A real word rather than a misspelling of size/sigh/side, and unlike the
# name syllables it appears in genuine player-facing prose - the option helptext, FEATURES.md and
# the changelog - so it belongs here rather than in a file exclusion. #435.
sie = "sie"
# Vanilla's own misspelling. `AggregateWith` on four snapjaw blueprints carries the literal value
# "Snapjaw Scavanger" while the creature is named "Snapjaw Scavenger" - Freehold typed it once and
# the tag has to match exactly or the aggregate silently splits. Quoted verbatim in the docstrings
# and docs explaining the mechanism, so the misspelling is the accurate thing to write. #171.
Scavanger = "Scavanger"

[files]
extend-exclude = [
  "docs/2.2-changelog.txt",          # Mura's document, preserved verbatim
  "docs/mura-feature-notes-wip.txt", # likewise
  "mod/Textures/**",
  # Generated by tools/snapshot_qud_api.py: 5,202 of Freehold's blueprint names and 1,605 class
  # names, verbatim. Nobody wrote this prose and nobody can fix a typo in it - the names have to
  # match the game exactly or the checks reading them are wrong.
  #
  # Excluded as a file rather than allowlisted as words, per the rule above. Qud's own vocabulary
  # collides with real corrections - Mak, Otho, Thah, Girshling Cresh, Shug'rith - and one of them,
  # Finish_ExploringRedrock_TravelToBethseda, is a genuine misspelling in vanilla's quest ID.
  # Allowlisting these would exempt them from every document in the repo, including player-facing
  # text, which is exactly the padding this policy exists to prevent.
  "tools/qud-api.json",
  # Name syllables, not prose. `thi`, `sya`, `nye` and the rest are fragments assembled into
  # invented names -- nobody wrote a word here and there is no typo to fix. Excluded as a file
  # for the same reason as the snapshot above: allowlisting `thi` as a word would exempt it from
  # every document in the repo including player-facing text, which is the padding this policy
  # exists to prevent.
  "mod/Core/Naming.xml",
  "mod/Scripting/Vixy_NameSyllables.cs", # the same syllables, restated for the option
]
