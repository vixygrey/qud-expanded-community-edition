name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No dependencies to install: the validator is Python 3 standard library only, which is
      # what keeps the "no build step" rule (charter rule 4) true for contributors as well as
      # for the game.
      - name: Validate mod
        run: python3 tools/validate_mod.py --all

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: typos
        uses: crate-ci/typos@v1.49.0
        with:
          config: .typos.toml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventions:
    name: PR conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional commit format, with the repo-specific scopes from CLAUDE.md.
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z-]+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix(tables): merge Artifact 3-8'"
            echo "Got: $TITLE"
            exit 1
          fi

      # CLAUDE.md: every PR updates the changelog. It is where charter rule 2's causality
      # reaches players, who never read commit messages. Label 'skip-changelog' to opt out.
      - name: Changelog updated
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::No CHANGELOG.md entry. Add one (Keep a Changelog format), or apply the 'skip-changelog' label if this PR genuinely changes nothing worth recording."
            exit 1
          fi
