name: CI

on:
  # `edited` is not in the default set (opened, synchronize, reopened), and without it the
  # "PR conventions" job below cannot be satisfied: it reads the PR title from the event payload,
  # so retitling a PR to fix a failing title neither re-runs the job nor changes what a manual
  # re-run sees - a re-run replays the original payload. The check stays red until an unrelated
  # commit is pushed, which is a poor reason to make someone write one.
  #
  # `labeled` and `unlabeled` are here for the same reason (#346). The changelog gate reads
  # `github.event.pull_request.labels`, so applying `skip-changelog` after the run fired could
  # never satisfy it - no new run, and a manual re-run replays the original payload, so the check
  # stayed red with the label visibly applied. Removing the label has to re-run it too, or a PR
  # could be exempted and then un-exempted without the gate ever seeing the second half.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate mod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_docs.py compares Mura's preserved documents against the upstream-2.2 tag, and a
          # shallow checkout has neither the tag nor the blobs behind it. The check reports a
          # missing tag as a failure rather than skipping, so it cannot quietly stop running.
          fetch-depth: 0

      # No dependencies to install: the validator is Python 3 standard library only, which is
      # what keeps the "no build step" rule (charter rule 4) true for contributors as well as
      # for the game.
      - name: Validate mod
        run: python3 tools/validate_mod.py --all

      # Checks the documents that describe the mod, which nothing did until #131. It cannot read a
      # sentence and ask whether it is still true, but a figure quoted in prose can be recounted
      # from mod/, and three staleness sweeps found exactly that class of error.
      - name: Check documentation
        run: python3 tools/check_docs.py

  python:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed explicitly rather than via a third-party action: one fewer dependency to
      # trust, and the pinned version is the one pre-commit and contributors run locally.
      - name: Install ruff
        # Must match the ruff-pre-commit rev in .pre-commit-config.yaml. Dependabot updates that
        # file and cannot see this pin, so bumping ruff is always a two-file change - and if the
        # two drift, CI's `ruff format --check` can disagree with the hook a contributor just ran.
        run: pipx install ruff==0.16.3

      - name: ruff check
        run: ruff check tools/

      - name: ruff format --check
        run: ruff format --check tools/

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tools/check_build_log.py reads a verdict the game wrote on a developer's machine, so the
      # check itself can never run here (#134). Its guards can, and they are the part worth
      # covering: that script's whole job is refusing a stale or unrelated verdict, and a guard
      # that has quietly stopped firing is indistinguishable from one that passes. The tests
      # build synthetic save directories, so they need no game and no dependencies.
      - name: unittest
        run: python3 -m unittest discover -s tools -v

  xml-format:
    name: XML format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # npm ci, not npm install: package-lock.json is committed so CI resolves exactly the
      # versions used locally. A formatter that disagrees with the contributor's is worse
      # than none.
      - name: Install formatter
        run: npm ci
      - name: prettier --check
        run: npx prettier --check "mod/**/*.xml" "mod/**/*.rpm"

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .typos.toml

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  conventions:
    name: PR conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    # Above the workflow's `contents: read`, because two steps here read the pull request itself
    # through the API: the maintainer-edits note, and #361's closing-link check, whose
    # `closingIssuesReferences` is a GraphQL field rather than anything in the event payload.
    # Read only - nothing in this job writes.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Conventional commit format, with the repo-specific scopes from CONTRIBUTING.md.
      - name: PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z-]+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix(tables): merge Artifact 3-8'"
            echo "Got: $TITLE"
            exit 1
          fi

      # Informational only. "Allow edits from maintainers" is a checkbox the CONTRIBUTOR owns -
      # there is no repository setting that requires it, and GitHub already defaults it on. This
      # never fails the build: a contribution should not be rejected over a checkbox, and a
      # maintainer can always cherry-pick the commit with authorship intact instead.
      - name: Note whether maintainers can edit this PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          can_modify=$(gh api "repos/$REPO/pulls/$PR" --jq '.maintainer_can_modify')
          if [ "$can_modify" = "true" ]; then
            echo "Maintainer edits are enabled — thank you, that lets us rebase for you."
          else
            echo "::notice::Maintainer edits are disabled on this PR. That is fine and changes nothing about whether it can be merged. Enabling 'Allow edits from maintainers' just lets us rebase or add a changelog entry for you rather than asking; otherwise we cherry-pick your commit, which keeps your authorship either way."
          fi

      # docs/LESSONS.md has prescribed `gh pr view --json closingIssuesReferences` since #292, and a
      # habit is a check with an expiry date - I ran it on five consecutive pull requests, found
      # nothing, stopped, and the sixth closed an issue whose body said it should not. Charter rule
      # 4: keep new checks in the script rather than in prose. #361.
      #
      # `closingIssuesReferences` is a GraphQL field that GitHub resolves from the body's keywords,
      # so this needs `gh` and a token - the event payload does not carry the resolved links. The
      # body comes from the payload, which is why `edited` is in the trigger list above: a body
      # edited to fix this failure has to re-run the job.
      - name: Stated intent agrees with the closing links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          closes=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences')
          printf '%s' "$BODY" | python3 tools/check_pr_intent.py --body-file - --closes-json "$closes"

      # CONTRIBUTING.md: every PR updates the changelog. It is where charter rule 2's causality
      # reaches players, who never read commit messages. Label 'skip-changelog' to opt out.
      - name: Changelog updated
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::No CHANGELOG.md entry. Add one (Keep a Changelog format), or apply the 'skip-changelog' label if this PR genuinely changes nothing worth recording."
            exit 1
          fi
