# Local gates. CI (.github/workflows/ci.yml) runs the same checks — these just fail faster.
#   pre-commit install     once, per clone
#   pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # NOTE: check-xml is deliberately absent. tools/validate_mod.py already parses every XML
      # and map file, and unlike check-xml it understands the inherited-defect baseline. Two
      # gates that can disagree is worse than one that is right.
      - id: check-json
        files: ^mod/.*\.json$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
        # LICENSE, LICENSE-CONTENT and NOTICE are canonical texts. Anyone verifying this really is
        # Apache-2.0 or CC BY 4.0 will diff them against the published version, so they stay
        # byte-identical — the same reasoning that exempts Mura's preserved documents.
        exclude: ^(mod/|LICENSE|LICENSE-CONTENT|NOTICE|docs/2\.2-changelog\.txt|docs/mura-feature-notes-wip\.txt)
      - id: trailing-whitespace
        # mod/ is excluded deliberately: reformatting it wholesale would destroy the
        # readability of `git diff upstream-2.2`. Formatting is tracked separately in #17.
        exclude: ^(mod/|LICENSE|LICENSE-CONTENT|NOTICE|docs/2\.2-changelog\.txt|docs/mura-feature-notes-wip\.txt)

  # Python lint + format for tools/. Scoped: mod/ contains no Python, and the exclusion keeps
  # the hook from ever reformatting shipped mod files. Pinned to the same version CI runs.
  # XML formatting for the shipped mod. Pinned to the versions in package.json; the local hook
  # runs the repo's own prettier so contributors and CI cannot disagree.
  - repo: local
    hooks:
      - id: prettier-xml
        name: prettier (mod XML)
        entry: npx --no-install prettier --write
        language: system
        files: ^mod/.*\.(xml|rpm)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^tools/.*\.py$
      - id: ruff-format
        files: ^tools/.*\.py$

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--config, .typos.toml]
        # .typos.toml's [files] extend-exclude does NOT cover these. pre-commit passes changed
        # files as explicit arguments, and an explicitly named file overrides the config's
        # exclusions. CI runs the action over the whole tree instead, where the config does apply,
        # so anything skipped has to be skipped in both places or it is skipped in neither.
        exclude: ^(tools/qud-api\.json|mod/Core/Naming\.xml|mod/Scripting/Vixy_NameSyllables\.cs)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-mod
        name: validate mod (reachability, merge discipline, scripts)
        entry: python3 tools/validate_mod.py
        language: system
        pass_filenames: false
        files: ^mod/

      - id: check-docs
        name: check docs (counts, links, sections, preserved files)
        entry: python3 tools/check_docs.py
        language: system
        pass_filenames: false
        files: ^(mod/|docs/|tools/validate_mod\.py$|[A-Z]+\.md$|NOTICE$)

      # Deliberately unscoped, unlike check-docs above. #446 put a diff3 base marker into
      # CHANGELOG.md and every gate passed it: pre-commit's own check-merge-conflict hook matches
      # "<<<<<<< ", "======= " and ">>>>>>> " but NOT "||||||| ", and check-docs only runs on the
      # paths above, so a marker in a workflow or a tool would not have been looked at either.
      # This runs on every commit and reads every tracked file, in 0.1s.
      - id: conflict-markers
        name: no leftover conflict markers (including the diff3 |||||||)
        entry: python3 tools/check_docs.py --conflict-markers
        language: system
        pass_filenames: false
        always_run: true

      # Automatic, unlike check-build-log below: this needs the game's assemblies but not a game
      # *launch*, and it finishes in under half a second. It skips with a notice when the game or a
      # .NET SDK is absent, so a contributor without either is not blocked by a hook they have no
      # way to satisfy. Pass --require to turn that skip into a failure.
      - id: compile-scripting
        name: compile the C# against the game's assemblies
        entry: python3 tools/compile_scripting.py
        language: system
        pass_filenames: false
        files: ^mod/(Scripting/.*\.cs|manifest\.json)$

      # always_run, not a files pattern, and that is the whole point. What this catches is a Qud
      # UPDATE, which correlates with nothing in the diff - the case that matters most is "Qud
      # updated last night and today's commit is a docs change", which any files pattern misses.
      # ~1.5s where the game is installed, and an immediate skip where it is not.
      #
      # --assembly because that is how the committed snapshot is built; without it the comparison
      # is between two different kinds of snapshot and means nothing (#244). Skips loudly when the
      # game, the .NET SDK or ilspycmd is absent, so a contributor without them is not blocked by
      # a hook they cannot satisfy. Pass --require to turn that skip into a failure.
      - id: snapshot-check
        name: check the API snapshot matches the installed game (skips without Qud)
        entry: python3 tools/snapshot_qud_api.py --check --assembly
        language: system
        pass_filenames: false
        always_run: true

      # always_run for the same reason as the hook above, and it is the cheaper of the two at
      # ~0.2s. Pool membership is decided by tags on VANILLA base blueprints - BaseArrow carries
      # DynamicObjectsTable:Ammo - so a Qud update can move it with nothing in this repository's
      # diff to notice. A files pattern would miss exactly that.
      #
      # Not in CI, and it cannot be: no runner has the game, and without it the vanilla half of
      # the inheritance is invisible. A mod-only version of this check would report 0 arrows in
      # the ammo pool and be right by luck, while missing a new blueprint inheriting BaseArrow -
      # which is the regression it exists to catch (#303). Skips loudly without the game.
      - id: dynamic-pools
        name: check dynamic pool membership matches the snapshot (skips without Qud)
        entry: python3 tools/report_dynamic_tables.py --check
        language: system
        pass_filenames: false
        always_run: true

      # Manual stage deliberately. This reads a verdict Caves of Qud wrote on the last launch, so
      # as an automatic hook it would fail in two situations that are not defects: mid-work, when
      # C# has been edited but the game not relaunched, and on any machine without the game
      # installed. A hook people learn to --no-verify past is worse than one they run on purpose.
      #   pre-commit run --hook-stage manual check-build-log
      - id: check-build-log
        name: check the game compiled the C# (needs Qud installed; run manually)
        entry: python3 tools/check_build_log.py
        language: system
        pass_filenames: false
        stages: [manual]

      - id: no-commit-to-main
        # GitHub protects main server-side, but failing here beats a rejected push. See #20.
        name: refuse commits on main
        entry: bash -c '[ "$(git rev-parse --abbrev-ref HEAD)" != "main" ] || { echo "Refusing to commit on main. Branch first — see CONTRIBUTING.md."; exit 1; }'
        language: system
        pass_filenames: false
        always_run: true
